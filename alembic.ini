[alembic]
script_location = %(here)s/migrations
# date first, so the files sort in the order they were written
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s_%%(rev)s
truncate_slug_length = 40
prepend_sys_path = .
path_separator = os
# the URL comes from the app's settings (DATABASE_URL), see migrations/env.py

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
