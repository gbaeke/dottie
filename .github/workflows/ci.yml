name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dottie
          POSTGRES_PASSWORD: dottie
          POSTGRES_DB: dottie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dottie" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://dottie:dottie@localhost:5432/dottie_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
      - run: scripts/check.sh
