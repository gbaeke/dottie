[project]
name = "dottie"
version = "0.1.0"
description = "Dottie"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "azure-containerapps-sandbox>=0.1.0b4",
    "azure-identity>=1.26.0",
    "croniter>=6.2.4",
    "deepagents>=0.7.22",
    "fastapi>=0.142.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dottie = "dottie:main"

[tool.uv.build-backend]
module-name = ["dottie", "dottie_runtime"]  # dottie_runtime is what runs inside a dottie's sandbox

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, comprehensions, return, pathlib, ruff, FastAPI,
# security (bandit), unused arguments, print, commented-out code, and McCabe complexity: a function over 10
# branches is a function to split
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH", "RUF", "FAST", "S", "ARG", "T20", "ERA", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]  # asserts, test secrets, fixtures used for their side effect
"src/*/openapi.py" = ["T201"]  # prints the schema

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
